<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Catalogue</title>
<!-- PDSO unit catalogue sheets. unit_grouping_service.write_outputs replaces the data token below.
     Sheets are A3 landscape and drawn at true scale, so Print > Save as PDF gives measurable drawings. -->
<style>
@page{size:420mm 297mm;margin:0}
:root{--ink:#1b1b1a;--muted:#6e6e68;--line:#1b1b1a;--thin:#9a9a94;--room:#f1efe8;--shared:#e6e6e2;--entr:#c8372d;--win:#2a6fb0;--paper:#fff;--desk:#dcdcd6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#2b2b29;color:#f2f2ee;font-size:13px}
.toolbar b{font-weight:600}
.toolbar button{font:inherit;border:1px solid #6b6b66;background:#3a3a37;color:#f2f2ee;border-radius:6px;padding:5px 12px;cursor:pointer}
.toolbar .muted{color:#b5b5ae}
.toolbar nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.toolbar nav a{color:#f2f2ee;text-decoration:none;border:1px solid #55554f;border-radius:5px;padding:3px 8px;font-size:12px}
.pages{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 12px 60px}
.sheet{width:420mm;height:297mm;background:var(--paper);position:relative;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;flex:none}
.frame{position:absolute;inset:10mm;border:0.5mm solid var(--line);display:grid;grid-template-columns:1fr 78mm}
.draw{position:relative;border-right:0.35mm solid var(--line);padding:8mm;display:flex;flex-direction:column;gap:5mm;min-width:0}
.tb{display:flex;flex-direction:column}
.tb > div{border-bottom:0.25mm solid var(--line);padding:2.5mm 3.5mm}
.tb .grow{flex:1;border-bottom:0.25mm solid var(--line);overflow:hidden}
.tb .lab{font-size:7.5pt;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tb .val{font-size:10pt;font-weight:600}
.tb .big{font-size:15pt;font-weight:700;line-height:1.15}
.tb .num{font-size:22pt;font-weight:800;letter-spacing:.02em}
.tb .row{display:grid;grid-template-columns:1fr 1fr;gap:0}
.tb .row > div{padding-right:2mm}
.tb .stamp{color:var(--entr);font-weight:700;font-size:9pt;letter-spacing:.04em}
.sheet-title{display:flex;align-items:baseline;gap:4mm}
.sheet-title h2{margin:0;font-size:16pt}
.sheet-title .sub{color:var(--muted);font-size:10pt}
.plan-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.below{display:flex;gap:8mm;align-items:flex-end;justify-content:space-between}
table{border-collapse:collapse;font-size:8.5pt}
th,td{border-bottom:0.2mm solid var(--thin);padding:1.1mm 2mm;text-align:left;font-weight:normal;vertical-align:top}
th{font-size:7pt;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tb table{width:100%}
.legend{display:flex;gap:4mm;flex-wrap:wrap;font-size:8pt;color:var(--muted);align-items:center}
.sw{display:inline-block;width:3.2mm;height:3.2mm;border:0.2mm solid var(--line);vertical-align:-0.6mm;margin-right:1mm}
.keyplans{flex:1;display:grid;gap:5mm;min-height:0}
.kp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.kp .cap{font-size:8.5pt;font-weight:600;margin-top:1.5mm}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media print{
  html,body{background:none}
  .toolbar{display:none}
  .pages{padding:0;gap:0;display:block}
  .sheet{box-shadow:none;page-break-after:always;break-after:page;zoom:1!important}
}
</style>
</head>
<body>
<div class="toolbar">
  <b>Unit Catalogue</b><span class="muted" id="tbInfo"></span>
  <button id="printBtn">Print / Save as PDF</button>
  <span class="muted">A3 landscape, drawn to scale</span>
  <nav id="nav"></nav>
</div>
<div class="pages" id="pages"></div>
<script>
const DATA = __DATA__;
const G = DATA.geometry || {rooms:[],walls:[],doors:[],windows:[]};
const NS="http://www.w3.org/2000/svg", SF2M=0.09290304, FT2MM=304.8;
const TYPE_COLORS=["#9cc7bd","#e9bf8f","#b3c6ea","#e3adb8","#c6d79a","#d2b9e6","#efd88a","#a6d6e3"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m2=sf=>(sf*SF2M).toFixed(2);
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const roomById=Object.fromEntries(G.rooms.map(r=>[r.id,r]));
const unitByUid=Object.fromEntries(DATA.units.map(u=>[u.uid,u]));
const types=DATA.unit_types||[];
const typeColor=id=>TYPE_COLORS[Math.max(0,types.findIndex(t=>t.id===id))%TYPE_COLORS.length];
const levels=[]; DATA.units.forEach(u=>{if(!levels.includes(u.level))levels.push(u.level)});
const today=DATA.harvested||"";
const short=uid=>uid.slice(uid.lastIndexOf("-")+1);

function bboxOf(pointLists){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pointLists.forEach(ps=>ps.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}));return {x0,y0,x1,y1,w:x1-x0,h:y1-y0};}
function pickScale(wFt,hFt,maxWmm,maxHmm,choices){for(const s of choices){if(wFt*FT2MM/s<=maxWmm&&hFt*FT2MM/s<=maxHmm)return s;}return choices[choices.length-1];}
const pts=(ps,T)=>ps.map(T).map(p=>p[0].toFixed(3)+","+p[1].toFixed(3)).join(" ");
function centroid(ps){let x=0,y=0;ps.forEach(p=>{x+=p[0];y+=p[1]});return [x/ps.length,y/ps.length];}

// ---------- title block ----------
function titleBlock(o){
  return `<div class="tb">
    <div><div class="lab">Project / model</div><div class="val">${esc(DATA.model)}</div></div>
    <div><div class="lab">Drawing set</div><div class="val">Unit Catalogue (lodging)</div></div>
    <div class="grow">${o.body||""}</div>
    <div><div class="lab">Sheet title</div><div class="big">${esc(o.title)}</div></div>
    <div class="row"><div><div class="lab">Scale</div><div class="val">${esc(o.scale)}</div></div><div><div class="lab">Date</div><div class="val">${esc(today.slice(0,10))}</div></div></div>
    <div class="row"><div><div class="lab">Source</div><div class="val" style="font-size:8pt">Find Units (PDSO, prototype)</div></div><div><div class="lab">Sheet</div><div class="num">${esc(o.number)}</div></div></div>
    <div><span class="stamp">DRAFT — NOT FOR CONSTRUCTION</span></div>
  </div>`;
}

function scaleBar(svgParent, scale){ // a 5 m bar drawn in mm
  const mm=v=>v*1000/scale;
  const s=el("svg",{width:mm(5)+14+"mm",height:"9mm",viewBox:`-3 0 ${mm(5)+14} 9`},svgParent);
  for(let i=0;i<5;i++) el("rect",{x:i*mm(1),y:2,width:mm(1),height:1.6,fill:i%2?"#fff":"#1b1b1a",stroke:"#1b1b1a","stroke-width":.2},s);
  [0,1,5].forEach(v=>{const t=el("text",{x:mm(v),y:7.6,"font-size":2.6,"text-anchor":"middle",fill:"#1b1b1a"},s);t.textContent=v+(v===5?" m":"");});
  return s;
}
function northArrow(parent){
  const s=el("svg",{width:"11mm",height:"14mm",viewBox:"0 0 11 14"},parent);
  el("circle",{cx:5.5,cy:8,r:4.5,fill:"none",stroke:"#1b1b1a","stroke-width":.3},s);
  el("path",{d:"M5.5 3.5 L8 11 L5.5 9.4 L3 11 Z",fill:"#1b1b1a"},s);
  const t=el("text",{x:5.5,y:2.6,"font-size":2.6,"text-anchor":"middle","font-weight":700},s);t.textContent="N";
  return s;
}

// ---------- plan drawing ----------
function drawPlan(opts){
  // opts: level, box (ft), scale, focus (Set of room ids or null), colorOf(room)->fill, labels, openings, unitLabels
  const {level,box,scale}=opts, pad=opts.pad||2;
  const x0=box.x0-pad,y1=box.y1+pad,w=box.w+2*pad,h=box.h+2*pad;
  const T=p=>[p[0]-x0,y1-p[1]];
  const svg=el("svg",{width:(w*FT2MM/scale).toFixed(2)+"mm",height:(h*FT2MM/scale).toFixed(2)+"mm",viewBox:`0 0 ${w} ${h}`});
  const clipId="c"+Math.random().toString(36).slice(2);
  const defs=el("defs",{},svg); const cp=el("clipPath",{id:clipId},defs); el("rect",{x:0,y:0,width:w,height:h},cp);
  const g=el("g",{"clip-path":`url(#${clipId})`},svg);
  const lw=v=>v*scale/100; // keep line weights readable at any scale
  G.rooms.filter(r=>r.level===level).forEach(r=>{
    const inFocus=!opts.focus||opts.focus.has(r.id);
    const fill=opts.colorOf?opts.colorOf(r,inFocus):(inFocus?"var(--room)":"#fafaf8");
    el("polygon",{points:pts(r.outline,T),fill,stroke:"none"},g);
  });
  G.walls.filter(wl=>wl.level===level).forEach(wl=>el("polyline",{points:pts(wl.points,T),fill:"none",stroke:"#1b1b1a","stroke-width":Math.max(wl.width_ft,lw(.12)),"stroke-linecap":"square"},g));
  if(opts.openings){
    const entr=new Set(), inUnit=new Set();
    DATA.units.forEach(u=>{u.entrances.forEach(e=>entr.add(e.id));u.interior_doors.forEach(e=>inUnit.add(e.id))});
    const mine=o=>!opts.focus||(o.sides||[]).some(id=>opts.focus.has(id));
    G.windows.filter(o=>o.level===level&&mine(o)).forEach(o=>{
      const [x,y]=T([o.x,o.y]),hw=(o.width_ft||3)/2,ax=-o.facing[1],ay=-o.facing[0];
      el("line",{x1:x-ax*hw,y1:y-ay*hw,x2:x+ax*hw,y2:y+ay*hw,stroke:"var(--win)","stroke-width":lw(.5)},g);
    });
    G.doors.filter(o=>o.level===level&&mine(o)).forEach(o=>{
      const [x,y]=T([o.x,o.y]);
      if(entr.has(o.id)){
        el("circle",{cx:x,cy:y,r:lw(.75),fill:"var(--entr)"},g);
        const u=DATA.units.find(u=>u.entrances.some(e=>e.id===o.id));
        const into=u&&u.rooms.some(r=>r.id===o.sides[0])?1:-1;
        el("line",{x1:x,y1:y,x2:x+o.facing[0]*into*lw(2),y2:y-o.facing[1]*into*lw(2),stroke:"var(--entr)","stroke-width":lw(.25)},g);
      } else el("circle",{cx:x,cy:y,r:lw(.4),fill:"#8a8a84"},g);
    });
  }
  if(opts.labels) G.rooms.filter(r=>r.level===level&&(!opts.focus||opts.focus.has(r.id))).forEach(r=>{
    const [cx,cy]=centroid(r.outline.map(T)), fs=lw(.95);
    const t=el("text",{x:cx,y:cy,"font-size":fs,"text-anchor":"middle",fill:"#1b1b1a","font-weight":600},g);t.textContent=r.name;
    const a=el("text",{x:cx,y:cy+fs*1.2,"font-size":fs*.85,"text-anchor":"middle",fill:"#55554f"},g);a.textContent=m2(r.area_sf)+" m²";
  });
  if(opts.unitLabels) DATA.units.filter(u=>u.level===level).forEach(u=>{
    const [x,y]=T(u.center), fs=lw(1.05);
    const t=el("text",{x,y:y+fs*.35,"font-size":fs,"text-anchor":"middle","font-weight":700,fill:"#1b1b1a"},g);t.textContent=short(u.uid)+(u.type?" · "+u.type:"");
  });
  return svg;
}

// ---------- sheets ----------
const pages=document.getElementById("pages"), nav=document.getElementById("nav");
function addSheet(number,title,build){
  const s=document.createElement("section"); s.className="sheet"; s.id="sheet-"+number;
  s.innerHTML=`<div class="frame"><div class="draw"></div>${titleBlock(build.tb)}</div>`;
  pages.appendChild(s); build.fill(s.querySelector(".draw"));
  const a=document.createElement("a"); a.href="#"+s.id; a.textContent=number; a.title=title; nav.appendChild(a);
}

// Summary sheet
(function(){
  const allRooms=G.rooms.filter(r=>levels.includes(r.level));
  const box=bboxOf(allRooms.map(r=>r.outline));
  const cols=levels.length>2?2:levels.length, rows=Math.ceil(levels.length/cols);
  const cellW=(420-20-78-16-(cols-1)*5)/cols, cellH=(297-20-16-60-(rows-1)*5)/rows-6;
  const scale=pickScale(box.w+4,box.h+4,cellW,cellH,[100,150,200,250,300,400,500,750,1000]);
  const total=DATA.units.length;
  const typeRows=types.map(t=>`<tr><td><span class="sw" style="background:${typeColor(t.id)}"></span>${esc(t.id)}</td><td>${esc(t.name)}</td><td class="n">${t.units.length}</td><td class="n">${m2(t.area_sf)}</td><td class="n">${t.bedrooms}</td><td class="n">${t.bathrooms}</td></tr>`).join("");
  addSheet("C-000","Summary",{
    tb:{title:"Summary — unit types and key plans",number:"C-000",scale:"1:"+scale+" (key plans)",
      body:`<div class="lab">Totals</div><table><tr><td>Units</td><td class="n">${total}</td></tr><tr><td>Unit types</td><td class="n">${types.length}</td></tr><tr><td>Levels</td><td class="n">${levels.length}</td></tr><tr><td>Entrances</td><td class="n">${DATA.summary.entrances}</td></tr><tr><td>Windows in units</td><td class="n">${DATA.summary.windows_in_units}</td></tr></table>
            <div class="lab" style="margin-top:3mm">Sheets</div><table>${types.map((t,i)=>`<tr><td>C-${String(101+i)}</td><td>${esc(t.name)}</td></tr>`).join("")}</table>`},
    fill(d){
      d.innerHTML=`<div class="sheet-title"><h2>Summary</h2><span class="sub">${total} units in ${types.length} types, ${levels.length} levels</span></div>`;
      const kp=document.createElement("div"); kp.className="keyplans"; kp.style.gridTemplateColumns=`repeat(${cols},1fr)`; d.appendChild(kp);
      levels.forEach(l=>{
        const c=document.createElement("div"); c.className="kp";
        const unitOfRoom={}; DATA.units.filter(u=>u.level===l).forEach(u=>u.rooms.forEach(r=>unitOfRoom[r.id]=u));
        c.appendChild(drawPlan({level:l,box,scale,pad:2,unitLabels:true,colorOf:r=>unitOfRoom[r.id]?typeColor(unitOfRoom[r.id].type):"var(--shared)"}));
        const cap=document.createElement("div"); cap.className="cap"; cap.textContent=l; c.appendChild(cap); kp.appendChild(c);
      });
      const below=document.createElement("div"); below.className="below";
      below.innerHTML=`<table><tr><th>Type</th><th>Name</th><th class="n">Units</th><th class="n">m²</th><th class="n">Bedrooms</th><th class="n">Baths</th></tr>${typeRows}</table>`;
      const right=document.createElement("div"); right.style.display="flex"; right.style.gap="4mm"; right.style.alignItems="flex-end";
      const lg=document.createElement("div"); lg.className="legend"; lg.innerHTML=`<span><span class="sw" style="background:var(--shared)"></span>Shared</span>`;
      right.appendChild(lg); northArrow(right); below.appendChild(right); d.appendChild(below);
    }});
})();

// One sheet per unit type
types.forEach((t,i)=>{
  const typical=unitByUid[t.typical_unit];
  const focus=new Set(typical.rooms.map(r=>r.id));
  const box=bboxOf(typical.rooms.map(r=>roomById[r.id].outline));
  const scale=pickScale(box.w+6,box.h+6,420-20-78-16-90,297-20-16-40,[25,50,75,100,150,200]);
  const number="C-"+(101+i);
  const byLevel={}; t.units.forEach(uid=>{const u=unitByUid[uid];(byLevel[u.level]=byLevel[u.level]||[]).push(short(uid));});
  const winByRoom={}; typical.windows.forEach(w=>{winByRoom[w.room]=(winByRoom[w.room]||0)+1;});
  const e=typical.entrances[0];
  addSheet(number,t.name,{
    tb:{title:t.name,number,scale:"1:"+scale,
      body:`<div class="lab">Units of this type (${t.units.length})</div><table>${Object.entries(byLevel).map(([l,us])=>`<tr><td>${esc(l)}</td><td>${esc(us.join(", "))}</td></tr>`).join("")}</table>
            <div class="lab" style="margin-top:3mm">Drawn from</div><div class="val">${esc(typical.uid)}</div>`},
    fill(d){
      d.innerHTML=`<div class="sheet-title"><h2>${esc(t.name)}</h2><span class="sub">${t.bedrooms} bedroom${t.bedrooms===1?"":"s"} · ${t.bathrooms} bath · ${m2(t.area_sf)} m² (rooms) · ${t.units.length} units</span></div>`;
      const pw=document.createElement("div"); pw.className="plan-wrap";
      const side=document.createElement("div"); side.style.cssText="display:flex;gap:8mm;align-items:center;justify-content:center;width:100%;height:100%";
      side.appendChild(drawPlan({level:typical.level,box,scale,pad:3,focus,labels:true,openings:true}));
      const tables=document.createElement("div"); tables.style.cssText="display:flex;flex-direction:column;gap:5mm;min-width:70mm";
      tables.innerHTML=`<table><tr><th>Room</th><th class="n">m²</th><th class="n">Win.</th></tr>${t.rooms.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${m2(r.area_sf)}</td><td class="n">${winByRoom[r.name]||0}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="n"><b>${m2(t.area_sf)}</b></td><td class="n"><b>${typical.windows.length}</b></td></tr></table>
        <table><tr><th>Entrance</th><th></th></tr><tr><td>Door</td><td>${esc(e?e.type:"-")}</td></tr><tr><td>From</td><td>${esc(e?e.opens_to:"-")}</td></tr><tr><td>Into</td><td>${esc(e?e.room:"-")}</td></tr></table>`;
      side.appendChild(tables); pw.appendChild(side); d.appendChild(pw);
      const below=document.createElement("div"); below.className="below";
      const lg=document.createElement("div"); lg.className="legend";
      lg.innerHTML=`<span><span class="sw" style="background:var(--room)"></span>Unit</span><span><span class="sw" style="background:#fafaf8"></span>Outside the unit</span><span style="color:var(--entr)">● Entrance</span><span style="color:#8a8a84">● Door</span><span style="color:var(--win)">— Window</span>`;
      below.appendChild(lg);
      const r=document.createElement("div"); r.style.cssText="display:flex;gap:5mm;align-items:flex-end"; scaleBar(r,scale); northArrow(r); below.appendChild(r);
      d.appendChild(below);
    }});
});

document.getElementById("tbInfo").textContent=` · ${DATA.model} · ${1+types.length} sheets`;
document.getElementById("printBtn").onclick=()=>window.print();
// Fit sheets to the window on screen (print uses true size)
function fit(){const z=Math.min(1,(window.innerWidth-24)/(420*96/25.4));document.querySelectorAll(".sheet").forEach(s=>s.style.zoom=z);}
window.addEventListener("resize",fit); fit();
</script>
</body>
</html>
