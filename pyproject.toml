[tool.ruff]
target-version = "py37"
extend-exclude = ["lib/extensible_storage"]  # vendored third-party code

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "UP",   # pyupgrade — invalid syntax for IronPython 2.7
    "ANN",  # type annotations — not used in IronPython
    "E402", # module-level import not at top — required by clr.AddReference() pattern
    "E722", # bare except — intentional defensive pattern in Revit API code
    "E731", # lambda assignment — intentional public API shortcuts
    "F403", # star imports — required pattern for Autodesk.Revit.DB / UI
    "F405", # may be from star import — affects unicode builtin in IronPython 2.7
]

[tool.ruff.lint.per-file-ignores]
# The docstring of an MCP tool is its description for the agent: one long line.
"mcp/pdso_mcp_server.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
