title: "Pull from\nCatalogue"

tooltip: >-
  Put a catalogue layout into the selected Room. Select a Room, an Area, or
  objects that are in one Room: the button is not available with no selection.
  A window shows the Room as it is now and the layouts that fit it, ranked,
  with a plan preview of each layout in the Room. The Room does not have to be
  harvested. The layout's id is written to "PDSO - Unit Layout Type" on any
  PDSO data silo in the room.

author: BBB DCT + hackathon team

context: selection

engine:
  clean: true
