title: "Pull from\nCatalogue"

tooltip: >-
  Put a catalogue layout into the selected unit (an Area with a PDSO data silo
  inside). Select the unit's Area or data silo, or objects that are in one
  unit: the button is not available with no selection. A window shows the unit
  as it is now and the layouts that fit it, ranked, with a plan preview of
  each layout in the unit. The unit does not have to be harvested. The
  layout's id is written to "PDSO - Unit Layout Type" on the unit's data silo.

author: BBB DCT + hackathon team

context: selection

engine:
  clean: true
